<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="use-iframe" content="true">
<meta name="html-box-height-mode" content="auto">
<meta name="description" content="crush_leetcode 代码 review 的问题分布图：36 个问题按数据与存储、内容脚本、复习算法、后台提醒、UI 交互、工程交付六个模块，以及高/中/低三档严重级别做堆叠柱状展示。">
<title>问题分布</title>
<script src="https://registry.npmmirror.com/echarts/5.5.0/files/dist/echarts.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #ffffff; color: #1f2937; }
  #wrap { width: 100%; padding: 12px 16px 16px; }
  #chart { width: 100%; height: 420px; }
  #st { min-height: 20px; font-size: 13px; color: #6b7280; text-align: center; padding: 8px 12px; }
</style>
</head>
<body>
<div id="wrap"><div id="chart"></div><div id="st" role="status">加载中...</div></div>
<script>
(function boot() {
  const st = document.getElementById("st") || document.getElementById("status");
  function setStatus(text) { if (st) st.textContent = text || ""; }

  if (typeof echarts === "undefined") {
    setStatus("图表库加载中...");
    return setTimeout(boot, 150);
  }

  const chart = echarts.init(document.getElementById("chart"));
  const DATA = [
    { name: "数据与存储", high: 3, medium: 3, low: 0 },
    { name: "内容脚本注入", high: 1, medium: 4, low: 2 },
    { name: "复习算法与时间", high: 1, medium: 3, low: 1 },
    { name: "后台与提醒", high: 1, medium: 3, low: 1 },
    { name: "UI / 交互", high: 0, medium: 3, low: 3 },
    { name: "工程与交付", high: 0, medium: 1, low: 6 }
  ];

  const option = {
    animation: false,
    title: {
      text: "36 个问题按模块与严重级别分布",
      subtext: "严重级别口径：高=会导致数据错误/丢失或密钥外泄；中=体验或稳定性受损；低=优化项",
      left: "center",
      textStyle: { fontSize: 17, fontWeight: 650, color: "#111827" },
      subtextStyle: { fontSize: 12, color: "#6b7280" }
    },
    tooltip: { trigger: "axis", axisPointer: { type: "shadow" } },
    legend: { top: 62, data: ["高", "中", "低"] },
    grid: { left: 130, right: 60, top: 100, bottom: 40 },
    xAxis: { type: "value", name: "问题数", axisLabel: { color: "#4b5563" }, splitLine: { lineStyle: { color: "#e5e7eb" } } },
    yAxis: {
      type: "category",
      inverse: true,
      data: DATA.map(function (d) { return d.name; }),
      axisLabel: { color: "#374151", fontSize: 13 }
    },
    series: [
      { name: "高", type: "bar", stack: "t", data: DATA.map(function (d) { return d.high; }), itemStyle: { color: "#ef4444" }, label: { show: true, color: "#fff", formatter: function (p) { return p.value > 0 ? p.value : ""; } } },
      { name: "中", type: "bar", stack: "t", data: DATA.map(function (d) { return d.medium; }), itemStyle: { color: "#f59e0b" }, label: { show: true, color: "#fff", formatter: function (p) { return p.value > 0 ? p.value : ""; } } },
      { name: "低", type: "bar", stack: "t", data: DATA.map(function (d) { return d.low; }), itemStyle: { color: "#94a3b8" }, label: { show: true, color: "#fff", formatter: function (p) { return p.value > 0 ? p.value : ""; } } }
    ]
  };

  try {
    chart.setOption(option, true);
    setStatus("");
  } catch (err) {
    const message = err && err.message ? err.message : String(err);
    setStatus("图表渲染失败: " + message);
    console.error(err);
  }

  window.addEventListener("resize", function () { chart.resize(); });
})();
</script>
</body>
</html>
